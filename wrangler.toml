name = "prims-sso"
account_id = "3c1d42c77978e6af0e458b6f1130c01b"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Static brand assets (kit.css, folio, favicon, fonts)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Non-secret config. Workers secrets (values never in git):
#   STYTCH_PROJECT_ID, STYTCH_SECRET, STYTCH_PUBLIC_TOKEN,
#   STYTCH_API_HOST, STYTCH_PROJECT_DOMAIN, STYTCH_ENV_SLUG
# Optional: STYTCH_ENV = "test" | "live" (else inferred from project id prefix)
# Eidos AGI Worker `prims-sso` already has custom domain login.prims.sh — do not recreate.
[vars]
RP_ID = "prims.sh"
SESSION_COOKIE = "prims_session"
SESSION_DURATION_MINUTES = "60"

# Primary account store = D1 (Slice 1). Why: checked-in SQL migrations + simple
# CRUD by account_id/email. DO reserved for later coordination-heavy state.
# database_id filled by `wrangler d1 create prims-sso-accounts` (replace LOCAL placeholder for remote).
[[d1_databases]]
binding = "DB"
database_name = "prims-sso-accounts"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"
